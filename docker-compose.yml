services:
  counter-security:
    build:
      context: ./back/spring-security
      dockerfile: Dockerfile
    container_name: counter-security-app
    restart: always
    environment:
      - PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://mi-servidor-db:5432/counter_db
      - SPRING_DATASOURCE_USERNAME=mi_usuario
      - SPRING_DATASOURCE_PASSWORD=mi_password
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
    ports:
      - "8081:8080"
    networks:
      - server_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/security/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  counter-analytics:
    build:
      context: .
      dockerfile: ./back/flask-analytics/Dockerfile
    container_name: counter-analytics-app
    restart: always
    environment:
      - PORT=5000
      - ANALYTICS_HOST=0.0.0.0
      - ANALYTICS_PORT=5000
      - ANALYTICS_DEBUG=False
      - DATABASE_URL=postgresql://mi_usuario:mi_password@mi-servidor-db:5432/counter_db
    ports:
      - "5001:5000"
    networks:
      - server_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  server_network:
    external: true
    name: server_network
