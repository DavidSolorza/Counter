server:
  port: 8080

spring:
  application:
    name: counter-security
  datasource:
    url: jdbc:sqlite:security.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    com.counter.security: INFO
