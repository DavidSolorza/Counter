server:
  port: ${PORT:8080}

spring:
  application:
    name: counter-security
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:mi-servidor-db}:${DB_PORT:5432}/${DB_NAME:counter_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:mi_usuario}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:mi_password}}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false

logging:
  level:
    com.counter.security: INFO
